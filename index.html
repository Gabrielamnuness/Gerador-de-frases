<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frase do dia</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #151515;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #222;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #ff4757; margin-bottom: 20px; }
        p #frase { font-style: italic; font-size: 1.2rem; min-height: 50px; display: block; }
        p #autor { color: #ffa502; font-weight: bold; margin-top: 10px; display: block; }
        
        .botoes-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        
        .btn-nova {
            background-color: #ff4757;
            color: white;
        }
        .btn-nova:hover { background-color: #e84118; }

        .btn-wpp {
            background-color: #25D366;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-wpp:hover { background-color: #128C7E; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Aqui foi alterado para remover o Cardápio Digital -->
        <h1>To remember</h1>
        <p><span id="frase">Carregando frase ...</span></p>
        <p><span id="autor"></span></p>
        
        <div class="botoes-container">
            <button class="btn-nova" onclick="obterFrase()">Nova Frase</button>
            <button class="btn-wpp" onclick="compartilharNoWhatsApp()">
                Compartilhar no WhatsApp
            </button>
        </div>
    </div>

    <script>
        async function obterFrase() {
            const fraseElemento = document.getElementById('frase');
            const autorElemento = document.getElementById('autor');
            
            fraseElemento.innerText = "Buscando nova frase...";
            autorElemento.innerText = "";

            try {
                const resposta = await fetch('https://allorigins.win' + encodeURIComponent('https://quotable.io'));
                const dadosJSON = await resposta.json();
                const dados = JSON.parse(dadosJSON.contents);
                
                const fraseIngles = dados.content;
                const autor = dados.author;

                const respostaTraducao = await fetch(`https://translated.net{encodeURIComponent(fraseIngles)}&langpair=en|pt`);
                const dadosTraducao = await respostaTraducao.json();
                const fraseTraduzida = dadosTraducao.responseData.translatedText;

                fraseElemento.innerText = `"${fraseTraduzida}"`;
                autorElemento.innerText = `- ${autor}`;
            } catch (erro) {
                const frasesSeguranca = [
                    { q: "O successo é a soma de pequenos esforços repetidos dia após dia.", a: "Robert Collier" },
                    { q: "Acredite que você pode e você já está no meio do caminho.", a: "Theodore Roosevelt" },
                    { q: "A mente que se abre a uma nova ideia jamais voltará ao seu tamanho original.", a: "Albert Einstein" }
                ];
                const aleatoria = frasesSeguranca[Math.floor(Math.random() * frasesSeguranca.length)];
                
                fraseElemento.innerText = `"${aleatoria.q}"`;
                autorElemento.innerText = `- ${aleatoria.a}`;
                console.error("Erro na API, usando frase local:", erro);
            }
        }

        function compartilharNoWhatsApp() {
            const frase = document.getElementById('frase').innerText;
            const autor = document.getElementById('autor').innerText;
            
            if (frase === "Buscando nova frase..." || frase === "Carregando frase inspiradora...") {
                alert("Aguarde a frase carregar para compartilhar!");
                return;
            }

            const textoMensagem = `*Frase do Dia:*\n\n${frase}\n${autor}\n\n_Enviado através do Gerador de Frases_`;
            const urlWhatsApp = `https://whatsapp.com{encodeURIComponent(textoMensagem)}`;
            window.open(urlWhatsApp, '_blank');
        }

        obterFrase();
    </script>
</body>
</html>
